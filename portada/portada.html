<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Operación Juguetes — Portada</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@600;700&display=block" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #14122a; }
  svg { display: block; width: 1920px; height: 1080px; }
  .t { font-family: 'Luckiest Guy', 'Comic Sans MS', sans-serif; paint-order: stroke fill; stroke-linejoin: round; }
  .f { font-family: 'Fredoka', 'Comic Sans MS', sans-serif; font-weight: 700; paint-order: stroke fill; stroke-linejoin: round; }
  .o { stroke: #1d1b2f; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
  .o3 { stroke: #1d1b2f; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
  .o7 { stroke: #1d1b2f; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1a45" />
      <stop offset="0.45" stop-color="#4a3a7a" />
      <stop offset="0.75" stop-color="#a5568a" />
      <stop offset="1" stop-color="#f4a261" />
    </linearGradient>
    <linearGradient id="pasto" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8a4a" />
      <stop offset="1" stop-color="#1a4026" />
    </linearGradient>
    <radialGradient id="luna" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fffbe6" />
      <stop offset="1" stop-color="#f6e7a8" />
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.55" />
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="luzVentana" cx="0.5" cy="0.6" r="0.7">
      <stop offset="0" stop-color="#fff1b8" />
      <stop offset="1" stop-color="#ffb703" />
    </radialGradient>
    <radialGradient id="brilloVentana" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffd166" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="brilloSotano" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cff9e" stop-opacity="0.5" />
      <stop offset="1" stop-color="#7cff9e" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="vineta" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0" />
      <stop offset="1" stop-color="#0b0820" stop-opacity="0.55" />
    </radialGradient>
    <linearGradient id="sombraPiso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0820" stop-opacity="0" />
      <stop offset="1" stop-color="#0b0820" stop-opacity="0.45" />
    </linearGradient>

    <!-- Telas, igual que en Personajes.js -->
    <pattern id="rayas" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#dbe4ff" />
      <rect width="9" height="18" fill="#4c6ef5" />
    </pattern>
    <pattern id="cuadros" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#9d0208" />
      <rect width="40" height="14" fill="#5c0011" opacity="0.7" />
      <rect width="14" height="40" fill="#5c0011" opacity="0.7" />
      <rect y="24" width="40" height="3" fill="#ffba08" />
      <rect x="24" width="3" height="40" fill="#ffba08" />
    </pattern>
    <pattern id="lunaresPanuelo" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#48cae4" />
      <circle cx="4" cy="4" r="2.4" fill="#fff" />
      <circle cx="11" cy="11" r="2.4" fill="#fff" />
    </pattern>
    <pattern id="tejido" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#ffafcc" />
      <path d="M0 5 L5 0 L10 5 M0 10 L5 5 L10 10" stroke="#f78fb3" stroke-width="2" fill="none" />
    </pattern>
    <pattern id="tablas" width="40" height="22" patternUnits="userSpaceOnUse">
      <rect width="40" height="22" fill="#7d6290" />
      <rect y="18" width="40" height="4" fill="#5e4872" />
    </pattern>
    <pattern id="tejas" width="44" height="26" patternUnits="userSpaceOnUse">
      <rect width="44" height="26" fill="#3b2a4d" />
      <path d="M0 26 Q11 12 22 26 Q33 12 44 26" fill="#2c1f3b" />
      <path d="M-22 13 Q-11 -1 0 13 Q11 -1 22 13 Q33 -1 44 13 Q55 -1 66 13" fill="none" stroke="#2c1f3b" stroke-width="3" />
    </pattern>
    <pattern id="ladrillos" width="24" height="14" patternUnits="userSpaceOnUse">
      <rect width="24" height="14" fill="#a14a3b" />
      <path d="M0 7 H24 M12 0 V7 M0 7 V14 M24 7 V14" stroke="#6b2b22" stroke-width="2" />
    </pattern>
    <pattern id="piedras" width="40" height="26" patternUnits="userSpaceOnUse">
      <rect width="40" height="26" fill="#6c6a82" />
      <path d="M0 13 H40 M20 0 V13 M0 13 V26 M40 13 V26" stroke="#4a4860" stroke-width="3" />
    </pattern>
    <pattern id="manchas" width="60" height="50" patternUnits="userSpaceOnUse">
      <rect width="60" height="50" fill="#f8f9fa" />
      <ellipse cx="15" cy="14" rx="9" ry="7" fill="#212529" />
      <ellipse cx="44" cy="34" rx="11" ry="8" fill="#212529" />
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0b0820" flood-opacity="0.45" />
    </filter>

    <!-- Una ventana a oscuras con cortinas -->
    <g id="ventanaOscura">
      <rect x="-40" y="-50" width="80" height="100" rx="4" fill="#2a2140" class="o3" />
      <path d="M-36 -46 Q-20 0 -30 46 L-36 46 Z" fill="#4b3b66" />
      <path d="M36 -46 Q20 0 30 46 L36 46 Z" fill="#4b3b66" />
      <path d="M0 -50 V50 M-40 0 H40" stroke="#1d1b2f" stroke-width="5" />
      <rect x="-48" y="50" width="96" height="10" rx="2" fill="#e9dcc9" class="o3" />
    </g>
    <!-- Marco de una ventana prendida (se pone encima del contenido) -->
    <g id="marcoPrendido">
      <path d="M0 -50 V50 M-40 0 H40" stroke="#1d1b2f" stroke-width="5" />
      <rect x="-40" y="-50" width="80" height="100" rx="4" fill="none" class="o3" />
      <rect x="-48" y="50" width="96" height="10" rx="2" fill="#e9dcc9" class="o3" />
    </g>
  </defs>

  <!-- ================= CIELO ================= -->
  <rect width="1920" height="1080" fill="url(#cielo)" />
  <g fill="#fff8dc">

  <path d="M1830 230 l4 -11 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 z" fill="#fff8dc" opacity="0.9" />

  <!-- Luna -->
  <circle cx="1690" cy="250" r="230" fill="url(#halo)" />
  <circle cx="1690" cy="250" r="120" fill="url(#luna)" />
  <circle cx="1650" cy="220" r="20" fill="#eedc95" /><circle cx="1725" cy="290" r="28" fill="#eedc95" /><circle cx="1720" cy="200" r="11" fill="#eedc95" />

  <g fill="#6d5a9c" opacity="0.75">

  <!-- Chimenea -->
  <rect x="1395" y="180" width="60" height="110" fill="url(#ladrillos)" class="o" />
  <rect x="1385" y="168" width="80" height="20" rx="3" fill="#5c2a22" class="o" />

    <circle cx="1430" cy="140" r="20" /><circle cx="1455" cy="110" r="26" /><circle cx="1490" cy="78" r="30" />
  </g>

  <!-- Techo -->
  <path d="M920 372 L1260 135 L1600 372 Z" fill="url(#tejas)" class="o7" />
  <path d="M910 372 H1610" stroke="#1d1b2f" stroke-width="16" stroke-linecap="round" />
  <path d="M910 372 H1610" stroke="#5e4872" stroke-width="8" stroke-linecap="round" />

  <path d="M1112 305 L1170 266" stroke="#e8f6ff" stroke-width="4" opacity="0.8" />

  <rect x="950" y="838" width="620" height="48" fill="url(#piedras)" class="o" />

  <!-- Ventana redonda del ático (con el cohete) -->
  <circle cx="1260" cy="275" r="64" fill="url(#brilloVentana)" />
  <circle cx="1260" cy="275" r="46" fill="url(#luzVentana)" />

  <circle cx="1260" cy="275" r="46" fill="none" stroke="#1d1b2f" stroke-width="7" />

    <circle cx="1366" cy="452" r="9" /><circle cx="1394" cy="452" r="9" />
    <ellipse cx="1380" cy="482" rx="20" ry="18" />
    <circle cx="1380" cy="463" r="15" />
  </g>
  <ellipse cx="1380" cy="468" rx="6" ry="4" fill="#e0b48a" />

  <use href="#marcoPrendido" x="1380" y="445" />

  <ellipse cx="1260" cy="445" rx="30" ry="40" fill="#2a2140" class="o3" />
  <path d="M1260 405 V485" stroke="#1d1b2f" stroke-width="4" />

  <!-- 1er piso -->
  <use href="#ventanaOscura" x="1035" y="605" />
  <use href="#ventanaOscura" x="1380" y="605" />

    <rect x="1472" y="584" width="26" height="22" rx="4" fill="#ced4da" />
    <path d="M1485 584 V572" stroke="#1d1b2f" stroke-width="3" /><circle cx="1485" cy="570" r="4" fill="#e63946" />

  <circle cx="1479" cy="595" r="3" fill="#48cae4" /><circle cx="1491" cy="595" r="3" fill="#48cae4" />

  <rect x="1190" y="626" width="140" height="10" rx="3" fill="#e9dcc9" class="o3" />

  </g>

  <!-- Doña Pocha en la ventana, apuntando con el lanzarredes -->
  <circle cx="1140" cy="605" r="85" fill="url(#brilloVentana)" />
  <rect x="1100" y="555" width="80" height="100" rx="4" fill="url(#luzVentana)" />
  <g>
    <!-- saquito tejido -->
    <path d="M1108 655 Q1110 628 1140 624 Q1170 628 1172 655 Z" fill="url(#tejido)" class="o3" />
    <!-- cabeza -->
    <circle cx="1140" cy="600" r="25" fill="#f5c9a6" class="o3" />

    <path d="M1113 597 Q1114 570 1140 568 Q1166 570 1167 597 Q1140 585 1113 597 Z" fill="url(#lunaresPanuelo)" class="o3" />
    <ellipse cx="1140" cy="566" rx="10" ry="6" fill="#48cae4" class="o3" />
    <!-- ruleros -->
    <rect x="1121" y="584" width="9" height="12" rx="3" fill="#ff70a6" class="o3" />
    <rect x="1135" y="582" width="9" height="12" rx="3" fill="#ff70a6" class="o3" />
    <rect x="1149" y="584" width="9" height="12" rx="3" fill="#ff70a6" class="o3" />

    <path d="M1134 618 Q1140 623 1147 618" stroke="#c9184a" stroke-width="3" fill="none" stroke-linecap="round" />
